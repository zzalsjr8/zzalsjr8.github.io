<script>

// ###############################################################
// Initialise variables
// ###############################################################

let emojiCount = emojiData.length;

// ###############################################################
// Assign variables from document
// ###############################################################

let divEmojiData = document.getElementById("emojiDataOutput");

// ###############################################################
// Emoji Slider
// ###############################################################

function findEmoji(emoji) {
	function search(items, position = []) {
		for (let index = 0; index < items.length; index++) {
			const item = items[index];
			const emojiPosition = [...position, index];
			if (item.emoji === emoji && item.description) {
				return [
					emojiPosition,
					item.name,
					item.tag,
					item.description,
					item.version,
					item.emoji
				];
			}
			if (Array.isArray(item.children)) {
				const result = search(item.children, emojiPosition);
				if (result) {
					return result;
				}
			}
		}
		return null;
	}
	return search(emojiData);
}

// Display Size value - page load
let rangeInputEmojiValue = document.getElementById("rangeEmoji");
let emojiValue = document.getElementById("rangeEmoji").value;
let rangeInputEmojiValueDiv = document.getElementById("rangeEmojiDisplay");
let currentEmoji = emojiImages[emojiValue];
const result1 = findEmoji(currentEmoji);
const currentEmojiTag = result1[2];
let currentInfo = currentEmoji + " - " + currentEmojiTag;
let currentTitle = "<h1>" + currentEmojiTag + "</h1>";
let currentEmojiImg = "<div class='display-1'>" + currentEmoji + "</div>";
rangeEmojiDisplay.innerHTML = currentInfo;
divEmojiData.innerHTML = currentTitle + currentEmojiImg;


// rangeSize refresh
rangeInputEmojiValue.oninput = function() {
	emojiValue = this.value;
	currentEmoji = emojiImages[emojiValue];
	const result2 = findEmoji(currentEmoji);
	const currentEmojiTag = result2[2];
	currentInfo = currentEmoji + " - " + currentEmojiTag;
	currentTitle = "<h1>" + currentEmojiTag + "</h1>";
	currentEmojiImg = "<div class='display-1'>" + currentEmoji + "</div>";
	rangeEmojiDisplay.innerHTML = currentInfo;
	divEmojiData.innerHTML = currentTitle + currentEmojiImg;
}

</script>
